<!doctype html>
<title>Starting…</title>
<style>body{font-family:system-ui;display:grid;place-items:center;height:100vh;margin:0}</style>
<div><h2>⏳ App is waking up…</h2><p>This page reloads automatically.</p></div>
<script>
  const poll = async () => {
    try {
      {# Absolute on an app subdomain: the subdomain middleware rewrites every
         path to /apps/<slug>/… with no /api carve-out, so a relative poll came
         back as this very page and the loop spun forever. #}
      const r = await fetch("{{ readiness_url }}", { credentials: "include" });
      const j = await r.json();
      if (j.ready) { location.reload(); return; }
    } catch (e) {}
    setTimeout(poll, 2000);
  };
  poll();
</script>
