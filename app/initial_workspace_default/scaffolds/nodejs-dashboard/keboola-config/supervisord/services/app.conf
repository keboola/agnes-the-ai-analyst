; Required by the upstream data-app-python-js runtime contract: the base
; image's Supervisord reads keboola-config/supervisord/services/*.conf and
; starts each program after keboola-config/setup.sh has run.
[program:app]
command=node server/dist/index.js
directory=/app
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT="3000",NODE_ENV="production"
