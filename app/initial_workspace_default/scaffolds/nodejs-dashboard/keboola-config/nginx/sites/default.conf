# Required by the upstream data-app-python-js runtime contract:
# in-container nginx listens on 8888 and proxy_passes to the app process
# (this scaffold's Express server, started by supervisord on 3000).
server {
    listen 8888;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forwarded by the Agnes ingress proxy so the app can generate
        # correct absolute URLs when served under /apps/<slug>/.
        proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
    }
}
