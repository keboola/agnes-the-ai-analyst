; Reference top-level Supervisord config for running this scaffold outside
; the data-app-python-js base image (e.g. a local `docker build` smoke test).
; Inside the deployed runtime container, Supervisord instead auto-discovers
; keboola-config/supervisord/services/*.conf — that file is the one the
; upstream contract requires; this one just mirrors it for local dev.
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

[include]
files = keboola-config/supervisord/services/*.conf
